# Local development database. Start it with: docker compose up -d
# The credentials are for local use only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: idlehold
      POSTGRES_USER: idlehold
      POSTGRES_PASSWORD: idlehold
    # 5433 on the host so it never collides with a Postgres already installed on 5432.
    ports:
      - "5433:5432"
    volumes:
      - idlehold-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idlehold -d idlehold"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  idlehold-db:
